name: Programme 4 jours
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC, soit 06:00 ou 07:00 à Paris selon la saison
    - cron: "0 14 * * *"  # mise à jour en début d'après-midi
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python programme.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Publier la page
        run: |
          mkdir -p docs && cp index.html docs/index.html
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add docs/index.html && (git commit -m "maj" && git push || true)
